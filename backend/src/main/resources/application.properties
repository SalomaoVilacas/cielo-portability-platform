spring.application.name=backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./backend/data/platform;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
management.endpoints.web.exposure.include=health,info,metrics
integration.secret=local-demo-secret-change-for-production
integration.central-url=http://localhost:8081
integration.timeout-ms=1500
integration.retry-base-ms=1000
integration.max-attempts=5
central.confirmation-delay-ms=5000
